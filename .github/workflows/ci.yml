name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build · Test · Bench
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: Build
        run: go build -v ./...

      - name: Vet
        run: go vet ./...

      - name: Test (with race detector)
        run: go test -race -count=1 -timeout=60s ./...

      - name: Benchmark (smoke run)
        run: go test -bench=. -benchtime=1x -run='^$' ./internal/detector/ ./internal/nlp/

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest
          args: --timeout=3m

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t llm-security-monitor:ci .
      - name: Smoke test container
        run: |
          docker run -d --name proxy -p 8080:8080 \
            -e UPSTREAM_URL=http://localhost:11434 \
            -e BLOCK_MODE=true \
            llm-security-monitor:ci
          sleep 2
          curl -sf http://localhost:8080/health | grep -q '"status":"ok"'
          docker stop proxy
